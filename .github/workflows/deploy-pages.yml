name: Deploy fish labeling app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages-twfisher
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject public Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL || secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY || secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          mkdir -p _site/TWfisher
          cp -R mvp_site/. _site/TWfisher/
          node <<'NODE'
          const fs = require('fs');
          const config = {
            url: process.env.SUPABASE_URL.trim(),
            publishableKey: process.env.SUPABASE_PUBLISHABLE_KEY.trim(),
          };
          fs.writeFileSync(
            '_site/TWfisher/js/supabase-config.js',
            `globalThis.FISH_SUPABASE_CONFIG = ${JSON.stringify(config)};\n`,
          );
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
