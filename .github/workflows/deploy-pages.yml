name: Deploy fish labeling app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject public Supabase config
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_PUBLISHABLE_KEY"
          printf '%s\n' \
            'globalThis.FISH_SUPABASE_CONFIG = {' \
            "  url: ${SUPABASE_URL@Q}," \
            "  publishableKey: ${SUPABASE_PUBLISHABLE_KEY@Q}" \
            '};' > mvp_site/js/supabase-config.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: mvp_site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
